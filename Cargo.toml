[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*", "dnas/*/zomes/vendor/*"]

resolver = "2"

[workspace.dependencies]
# Exact pins: the DNA hash is frozen on this line, so a rebuild with a different
# hdi/hdk/holochain_serialized_bytes would produce a different DNA. Never relax these.
hdi = "=0.8.0"
hdk = "=0.7.0"
holochain_serialized_bytes = "=0.0.57"
serde = "1"

[workspace.dependencies.coordinator]
path = "dnas/whosin/zomes/coordinator/coordinator"

[workspace.dependencies.coordinator_integrity]
path = "dnas/whosin/zomes/integrity/coordinator"

[workspace.dependencies.notifications]
path = "dnas/whosin/zomes/coordinator/notifications"

# Vendored from https://github.com/holochain-open-dev/notifications @ f3b63da5 (branch
# main-0.6, "Update to Holochain 0.6", 2025-12-08). That repository has no 0.7 branch and
# has never carried a tag, so there is nothing to point a git dependency at on the 0.7
# line. See RELEASE.md / the upgrade report: to go back to an upstream crate, replace this
# entry and the two `{ workspace = true }` uses of it with a git dependency on a 0.7 tag
# -- but note that doing so after the canonical happ is frozen would change the DNA hash.
[workspace.dependencies.hc_zome_notifications_coordinator]
path = "dnas/whosin/zomes/vendor/notifications_coordinator"

[workspace.dependencies.notifications_integrity]
path = "dnas/whosin/zomes/integrity/notifications"

[workspace.dependencies.profiles]
path = "dnas/whosin/zomes/coordinator/profiles"

[workspace.dependencies.profiles_integrity]
path = "dnas/whosin/zomes/integrity/profiles"
